packages:
  - apps/*
  - packages/*

# exceljs (Paket 014, XLSX-Import) haengt an uuid ^8; <11.1.1 hat GHSA-w5hq-g745-h8pq
# (fehlende Puffergrenzenpruefung in v3/v5/v6 mit uebergebenem buf). exceljs ruft nur v4() ohne
# buf auf, und wir schreiben nie Arbeitsmappen -- erreichbar ist die Stelle also nicht. Der
# Override haelt trotzdem `pnpm audit` sauber, damit ein echter Fund kuenftig nicht im Rauschen
# untergeht.
overrides:
  uuid@<11.1.1: ^11.1.1

allowBuilds:
  '@hatchet-dev/typescript-sdk': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.504'
  - '@remotion/captions@4.0.504'
  - '@remotion/cli@4.0.504'
  - '@remotion/compositor-darwin-arm64@4.0.504'
  - '@remotion/compositor-darwin-x64@4.0.504'
  - '@remotion/compositor-linux-arm64-gnu@4.0.504'
  - '@remotion/compositor-linux-arm64-musl@4.0.504'
  - '@remotion/compositor-linux-x64-gnu@4.0.504'
  - '@remotion/compositor-linux-x64-musl@4.0.504'
  - '@remotion/compositor-win32-x64-msvc@4.0.504'
  - '@remotion/google-fonts@4.0.504'
  - '@remotion/licensing@4.0.504'
  - '@remotion/media-parser@4.0.504'
  - '@remotion/media-utils@4.0.504'
  - '@remotion/player@4.0.504'
  - '@remotion/renderer@4.0.504'
  - '@remotion/streaming@4.0.504'
  - '@remotion/studio-codemods@4.0.504'
  - '@remotion/studio-protocol@4.0.504'
  - '@remotion/studio-server@4.0.504'
  - '@remotion/studio-shared@4.0.504'
  - '@remotion/studio@4.0.504'
  - '@remotion/timeline-utils@4.0.504'
  - '@remotion/web-renderer@4.0.504'
  - '@remotion/zod-types@4.0.504'
  - remotion@4.0.504

onlyBuiltDependencies:
  - '@hatchet-dev/typescript-sdk'
  - esbuild
  - protobufjs
  - sharp
