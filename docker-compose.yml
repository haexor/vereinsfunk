name: marketing-saas

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes: &workspace-volumes
    - .:/workspace
    - pnpm-store:/pnpm/store
    - root-node-modules:/workspace/node_modules
    - web-node-modules:/workspace/apps/web/node_modules
    - api-node-modules:/workspace/apps/api/node_modules
    - worker-node-modules:/workspace/apps/worker/node_modules
    - remotion-node-modules:/workspace/apps/remotion/node_modules
    - authorization-node-modules:/workspace/packages/authorization/node_modules
    - config-node-modules:/workspace/packages/config/node_modules
    - content-engine-node-modules:/workspace/packages/content-engine/node_modules
    - contracts-node-modules:/workspace/packages/contracts/node_modules
    - domain-node-modules:/workspace/packages/domain/node_modules
    - media-processing-node-modules:/workspace/packages/media-processing/node_modules
    - observability-node-modules:/workspace/packages/observability/node_modules
    - orchestration-node-modules:/workspace/packages/orchestration/node_modules
    - publishing-node-modules:/workspace/packages/publishing/node_modules

services:
  deps:
    <<: *app-base
    command: pnpm install --frozen-lockfile

  api:
    <<: *app-base
    command: pnpm dev:api
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4201
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPABASE_URL: http://host.docker.internal:4260
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-local-service-role-key}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLISHING_PROVIDER: ${PUBLISHING_PROVIDER:-meta,twitter,linkedin}
      PUBLISHING_MODE: ${PUBLISHING_MODE:-fake}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      META_OAUTH_REDIRECT_URL: ${META_OAUTH_REDIRECT_URL:-}
      TWITTER_OAUTH_REDIRECT_URL: ${TWITTER_OAUTH_REDIRECT_URL:-}
      LINKEDIN_OAUTH_REDIRECT_URL: ${LINKEDIN_OAUTH_REDIRECT_URL:-}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      SECRET_BOX_KEYS: ${SECRET_BOX_KEYS:?set SECRET_BOX_KEYS in .env}
      SECRET_BOX_CURRENT_KEY_VERSION: ${SECRET_BOX_CURRENT_KEY_VERSION:?set SECRET_BOX_CURRENT_KEY_VERSION in .env}
    ports:
      - "127.0.0.1:4201:4201"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4201/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    <<: *app-base
    command: pnpm --filter @vereinsfunk/web exec nuxt dev --host 0.0.0.0 --port 4200
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: http://localhost:4201
      NUXT_PUBLIC_SUPABASE_URL: http://localhost:4260
      # Interpolated from the root .env, which Compose reads. The browser-safe NUXT_PUBLIC_*
      # values otherwise live in apps/web/.env -- but Compose's environment takes precedence
      # over that mounted file, so this stays the single source for the container.
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-replace-with-local-anon-key}
    ports:
      - "127.0.0.1:4200:4200"

  worker:
    <<: *app-base
    command: pnpm --filter @vereinsfunk/worker dev
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPABASE_URL: http://host.docker.internal:4260
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-local-service-role-key}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_API_URL: http://host.docker.internal:8080
      HATCHET_CLIENT_HOST_PORT: host.docker.internal:7077
      HATCHET_TLS: ${HATCHET_TLS:-false}
      SECRET_BOX_KEYS: ${SECRET_BOX_KEYS:?set SECRET_BOX_KEYS in .env}
      SECRET_BOX_CURRENT_KEY_VERSION: ${SECRET_BOX_CURRENT_KEY_VERSION:?set SECRET_BOX_CURRENT_KEY_VERSION in .env}

  remotion:
    <<: *app-base
    command: pnpm --filter @vereinsfunk/remotion exec remotion studio src/index.ts --host 0.0.0.0 --port 4202
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4202:4202"

volumes:
  pnpm-store:
  root-node-modules:
  web-node-modules:
  api-node-modules:
  worker-node-modules:
  remotion-node-modules:
  authorization-node-modules:
  config-node-modules:
  content-engine-node-modules:
  contracts-node-modules:
  domain-node-modules:
  media-processing-node-modules:
  observability-node-modules:
  orchestration-node-modules:
  publishing-node-modules:
