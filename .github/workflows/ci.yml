name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Der Job macht keine Git-Schreiboperation, braucht den Token nach dem Checkout
      # also nicht. Persistiert liegt er in .git/config, waehrend `pnpm install` die
      # Build-Skripte aus onlyBuiltDependencies ausfuehrt -- die kaemen sonst dran.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Ohne `version` liest action-setup das packageManager-Feld aus package.json.
      # Das haelt die pnpm-Version an einer Stelle -- Renovate pflegt sie dort mit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Eigener Schritt, nicht Teil von `pnpm db:test`: die pgTAP-Suite selbst braucht Docker und
      # laeuft hier nicht, diese Pruefung liest nur Dateien. Ohne sie waere der Waechter genau da
      # blind, wo der Fehler zweimal hereinkam -- im Pull Request.
      - run: pnpm db:test:isolation
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
