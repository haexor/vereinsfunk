name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Der Job macht keine Git-Schreiboperation, braucht den Token nach dem Checkout
      # also nicht. Persistiert liegt er in .git/config, waehrend `pnpm install` die
      # Build-Skripte aus onlyBuiltDependencies ausfuehrt -- die kaemen sonst dran.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Ohne `version` liest action-setup das packageManager-Feld aus package.json.
      # Das haelt die pnpm-Version an einer Stelle -- Renovate pflegt sie dort mit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # websiteRenderer.logoScoring.test.ts startet echtes Chromium (kein Mock) -- ohne diesen
      # Schritt fehlt die Runner-Binary und `pnpm test` schlaegt in apps/worker fehl.
      - run: pnpm --filter @vereinsfunk/worker exec playwright install --with-deps chromium
      - run: pnpm lint
      # Eigene Schritte, nicht Teil von `pnpm db:test`: die pgTAP-Suite selbst braucht Docker und
      # laeuft hier nicht, diese Pruefungen lesen nur Dateien.
      - run: pnpm db:test:isolation
      # Faengt zwei Migrationen mit demselben Zeitstempel-Praefix ab, wie sie parallele Branches
      # unabhaengig voneinander vergeben koennen. Lief bei diesem Wert erst hier auf `main` zusammen
      # (siehe scripts/check-migration-timestamps.mjs) -- die zwei betroffenen PRs waren einzeln
      # jeweils in sich konsistent.
      - run: pnpm db:test:timestamps
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
