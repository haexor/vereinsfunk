name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The host pulls `latest` (podman-auto-update.timer on haex.cloud, Watchtower elsewhere), so
# only main moves that tag. Every build also gets an immutable sha-<sha> tag, which is what the
# Ansible role pins to when a deploy needs to stay put.
#
# haex.cloud is aarch64. An amd64-only image lands there and dies with `exec format error` on
# first start -- that is exactly how the Kodus deploy failed on that host. The arm64 leg used to
# be QEMU-emulated from an amd64 runner, but esbuild (a Go binary, pulled in via Vite for the web
# app) hung indefinitely under that emulation -- Go's signal-based goroutine preemption is
# unreliable in QEMU user-mode (golang/go#67355, evanw/esbuild#2485), and the web image's
# `vite build` got stuck mid-`transforming` for over an hour before it had to be cancelled. Each
# arch now builds natively on its own runner instead, pushed by digest and merged into one
# multi-arch manifest below -- no QEMU involved anywhere.
jobs:
  # Gates `build` below: this workflow pushes `latest`, which Watchtower/podman-auto-update pull
  # into production automatically, independently of the CI workflow's own result -- pushing to main
  # with a migration timestamp collision (scripts/check-migration-timestamps.mjs) previously reached
  # production this way even though nothing here re-checked it.
  #
  # On a push to main, this checkout's HEAD *is* origin/main by the time the job starts -- the
  # script's default comparison ends up checking that ref against itself and can never find an
  # out-of-order migration (confirmed against the run for 3e64de23, the commit that shipped exactly
  # that bug to production: it reported success). MIGRATION_CHECK_BASE_REF below points the
  # comparison at the commit main pointed to right before this push instead, which is what actually
  # catches two independently-consistent PRs merging into an inconsistent main. fetch-depth: 0 makes
  # that commit's tree available locally; the default shallow checkout wouldn't have it.
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-migration-timestamps.mjs
        env:
          MIGRATION_CHECK_BASE_REF: ${{ github.ref == 'refs/heads/main' && github.event.before || '' }}

  build:
    needs: check-migrations
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vereinsfunk-${{ matrix.app }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/vereinsfunk-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vereinsfunk-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/vereinsfunk-${{ matrix.app }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/vereinsfunk-${{ matrix.app }}:${{ steps.meta.outputs.version }}
